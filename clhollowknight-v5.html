<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const baseUrl =
        'https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@d776aef07fb3ef5cd278d70c6f54742b27dd2f6d/';

      const response = await fetch(
        baseUrl + 'index.html',
        { cache: 'no-store' }
      );
      if (!response.ok) {
        throw new Error(`Could not load Hollow Knight (${response.status})`);
      }
      const html = await response.text();

      const gameDocument = html
        .replaceAll(
          'https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/',
          baseUrl
        )
        .replace(
          /<head([^>]*)>/i,
          '<head$1><base href="' + baseUrl + '">'
        );

      const iframe = document.createElement('iframe');
      iframe.src = URL.createObjectURL(
        new Blob([gameDocument], { type: 'text/html' })
      );
      iframe.allow = 'autoplay; fullscreen; gamepad';
      iframe.allowFullscreen = true;

      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
