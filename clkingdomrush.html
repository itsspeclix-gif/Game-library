<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kingdom Rush</title>
  <!-- Game Library injects this document into srcdoc/about:blank. Keep URLs absolute. -->
  <base href="https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrush/">
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #game { position:fixed; inset:0; }
    ruffle-player { display:block; width:100%; height:100%; }
    #status { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:12px; background:#111; color:#eee; text-align:center;
      padding:24px; box-sizing:border-box; font:16px/1.5 system-ui,sans-serif; z-index:2; }
    #status[hidden] { display:none; }
    #status small { opacity:.65; font-size:12px; }
    #message { max-width:640px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status" role="status" aria-live="polite">
    <strong>Kingdom Rush</strong>
    <span id="message">Loading Ruffle…</span>
    <small>KR-Ruffle 2026.09.19-r1</small>
  </div>
  <script>
  (async () => {
    "use strict";
    const assetBase = "https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrush/";
    const ruffleBase = "https://unpkg.com/@ruffle-rs/ruffle/";
    const parts = [
      ["kingdom-rush-12141.swf.part1", 16777216],
      ["kingdom-rush-12141.swf.part2", 15372780]
    ];
    const totalBytes = 32149996;
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    try {
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        publicPath: ruffleBase,
        polyfills: false,
        autoplay: "on",
        unmuteOverlay: "visible",
        letterbox: "on",
        scale: "showAll",
        forceScale: true,
        allowFullscreen: true,
        allowScriptAccess: false
      };
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = ruffleBase + "ruffle.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Ruffle could not be downloaded from unpkg.com."));
        document.head.appendChild(script);
      });

      // Stream directly into one final buffer; do not retain separate full-part copies.
      const data = new Uint8Array(totalBytes);
      let offset = 0;
      let lastPercent = -1;
      message.textContent = "Loading game: 0.0 / 32.1 MB";
      for (const [name, expectedBytes] of parts) {
        const response = await fetch(assetBase + name);
        if (!response.ok) throw new Error(name + ": HTTP " + response.status);
        if (!response.body) throw new Error(name + ": empty response body.");
        const reader = response.body.getReader();
        const partEnd = offset + expectedBytes;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          if (offset + value.byteLength > partEnd) {
            await reader.cancel();
            throw new Error(name + ": unexpected file size. Check the uploaded part.");
          }
          data.set(value, offset);
          offset += value.byteLength;
          const percent = Math.floor(offset * 100 / totalBytes);
          if (percent !== lastPercent) {
            lastPercent = percent;
            message.textContent = "Loading game: " + (offset / 1000000).toFixed(1) + " / 32.1 MB";
          }
        }
        if (offset !== partEnd) throw new Error(name + ": incomplete download. Close and reopen the game.");
      }
      message.textContent = "Starting Kingdom Rush…";
      const player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("game").appendChild(player);
      await player.ruffle(1).load({
        data,
        swfFileName: "kingdom-rush-12141.swf",
        base: assetBase
      });
      status.hidden = true;
      player.focus();
    } catch (error) {
      console.error("Kingdom Rush launcher:", error);
      message.textContent = "Unable to start: " + error.message + " Close and reopen the game to retry.";
      status.hidden = false;
    }
  })();
  </script>
</body>
</html>
