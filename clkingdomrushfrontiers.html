<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kingdom Rush Frontiers</title>
  <!-- Game Library injects this document into srcdoc/about:blank. Keep URLs absolute. -->
  <base href="https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrushfrontiers/">
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #game { position:fixed; inset:0; }
    ruffle-player { display:block; width:100%; height:100%; }
    #status { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:12px; background:#111; color:#eee; text-align:center;
      padding:24px; box-sizing:border-box; font:16px/1.5 system-ui,sans-serif; z-index:2; }
    #status[hidden] { display:none; }
    #status small { opacity:.65; font-size:12px; }
    #message { max-width:640px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status" role="status" aria-live="polite">
    <strong>Kingdom Rush Frontiers</strong>
    <span id="message">Loading Ruffle…</span>
    <small>KRF-Ruffle 2026.09.20-r2</small>
  </div>
  <script>
  (async () => {
    "use strict";
    const assetBase = "https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrushfrontiers/";
    const ruffleBase = "https://unpkg.com/@ruffle-rs/ruffle/";
    const parts = [
      ["krf-6dd546607ad2.part1", 16777216],
      ["krf-6dd546607ad2.part2", 16777216],
      ["krf-6dd546607ad2.part3", 16777216],
      ["krf-6dd546607ad2.part4", 8536099]
    ];
    const totalBytes = 58867747;
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    let stage = "Save isolation";
    try {
      // BEGIN FRONTIERS SAVE ISOLATION
      // Keep this prefix stable across launcher versions. Never import the shared KR keys.
      const savePrefix = "GameLibrary:ruffle:kingdom-rush-frontiers:";
      const rawStorage = window.localStorage;
      const saveKeys = () => Object.keys(rawStorage)
        .filter(key => key.startsWith(savePrefix))
        .map(key => key.slice(savePrefix.length));
      const saveMethods = {
        getItem: key => rawStorage.getItem(savePrefix + String(key)),
        setItem: (key, value) => rawStorage.setItem(savePrefix + String(key), String(value)),
        removeItem: key => rawStorage.removeItem(savePrefix + String(key)),
        clear: () => { for (const key of saveKeys()) rawStorage.removeItem(savePrefix + key); },
        key: index => saveKeys()[Number(index) >>> 0] ?? null
      };
      // Ruffle's WASM storage bridge uses storage[key], not only getItem/setItem.
      // Scope this window only; never patch Storage.prototype or the parent library.
      const saveStorage = new Proxy(Object.create(Storage.prototype), {
        get(_target, key) {
          if (key === "length") return saveKeys().length;
          if (key === Symbol.toStringTag) return "Storage";
          if (typeof key !== "string") return undefined;
          if (Object.prototype.hasOwnProperty.call(saveMethods, key)) return saveMethods[key];
          return saveMethods.getItem(key) ?? undefined;
        },
        set(_target, key, value) {
          if (typeof key !== "string") return false;
          saveMethods.setItem(key, value);
          return true;
        },
        deleteProperty(_target, key) {
          if (typeof key !== "string") return false;
          saveMethods.removeItem(key);
          return true;
        },
        has(_target, key) {
          return key === "length" || Object.prototype.hasOwnProperty.call(saveMethods, key) ||
            (typeof key === "string" && saveMethods.getItem(key) !== null);
        },
        ownKeys: saveKeys,
        getOwnPropertyDescriptor(_target, key) {
          if (typeof key !== "string") return undefined;
          const value = saveMethods.getItem(key);
          return value === null ? undefined :
            { value, writable: true, enumerable: true, configurable: true };
        },
        defineProperty(_target, key, descriptor) {
          if (typeof key !== "string" || !("value" in descriptor) ||
              !descriptor.configurable || !descriptor.enumerable || !descriptor.writable) return false;
          saveMethods.setItem(key, descriptor.value);
          return true;
        }
      });
      // Fail visibly if isolation cannot be installed; do not use shared storage as a fallback.
      Object.defineProperty(window, "localStorage", {
        configurable: true, enumerable: true, get: () => saveStorage
      });
      // END FRONTIERS SAVE ISOLATION

      stage = "Ruffle script";
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        publicPath: ruffleBase,
        polyfills: false,
        autoplay: "on",
        unmuteOverlay: "visible",
        letterbox: "on",
        scale: "showAll",
        forceScale: true,
        allowFullscreen: true,
        allowScriptAccess: false
      };
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = ruffleBase + "ruffle.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Ruffle could not be downloaded from unpkg.com."));
        document.head.appendChild(script);
      });

      // Stream directly into one final buffer; do not retain separate full-part copies.
      const data = new Uint8Array(totalBytes);
      let offset = 0;
      let lastPercent = -1;
      message.textContent = "Loading game: 0.0 / 58.9 MB";
      for (const [name, expectedBytes] of parts) {
        stage = name;
        const response = await fetch(assetBase + name);
        if (!response.ok) throw new Error(name + ": HTTP " + response.status);
        if (!response.body) throw new Error(name + ": empty response body.");
        const reader = response.body.getReader();
        const partEnd = offset + expectedBytes;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          if (offset + value.byteLength > partEnd) {
            await reader.cancel();
            throw new Error("Response exceeds the expected " + expectedBytes + " bytes.");
          }
          data.set(value, offset);
          offset += value.byteLength;
          const percent = Math.floor(offset * 100 / totalBytes);
          if (percent !== lastPercent) {
            lastPercent = percent;
            message.textContent = "Loading game: " + (offset / 1000000).toFixed(1) + " / 58.9 MB";
          }
        }
        if (offset !== partEnd) {
          throw new Error("Received " + (expectedBytes + offset - partEnd) + " of " + expectedBytes +
            " bytes. The response is incomplete or outdated.");
        }
      }
      stage = "Ruffle initialization";
      message.textContent = "Starting Kingdom Rush Frontiers…";
      const player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("game").appendChild(player);
      await player.ruffle(1).load({
        data,
        swfFileName: "kingdom-rush-frontie-15717.swf",
        base: assetBase
      });
      status.hidden = true;
      player.focus();
    } catch (error) {
      console.error("Kingdom Rush Frontiers launcher:", error);
      message.textContent = "Unable to start: [" + stage + "] " + error.message;
      status.hidden = false;
    }
  })();
  </script>
</body>
</html>
