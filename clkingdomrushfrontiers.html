<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kingdom Rush Frontiers</title>
  <!-- Game Library injects this document into srcdoc/about:blank. Keep URLs absolute. -->
  <base href="https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrushfrontiers/">
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #game { position:fixed; inset:0; }
    ruffle-player { display:block; width:100%; height:100%; }
    #status { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:12px; background:#111; color:#eee; text-align:center;
      padding:24px; box-sizing:border-box; font:16px/1.5 system-ui,sans-serif; z-index:2; }
    #status[hidden] { display:none; }
    #status small { opacity:.65; font-size:12px; }
    #message { max-width:640px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status" role="status" aria-live="polite">
    <strong>Kingdom Rush Frontiers</strong>
    <span id="message">Loading Ruffle…</span>
    <small>KRF-Ruffle 2026.09.20-r6-campaign</small>
  </div>
  <script>
  (async () => {
    "use strict";
    const assetBase = "https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/kingdomrushfrontiers/";
    const ruffleBase = "https://unpkg.com/@ruffle-rs/ruffle/";
    const parts = [
      ["krf-6dd546607ad2.part1", 16777216],
      ["krf-6dd546607ad2.part2", 16777216],
      ["krf-6dd546607ad2.part3", 16777216],
      ["krf-6dd546607ad2.part4", 8536099]
    ];
    const totalBytes = 58867747;
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    let stage = "Ruffle script";
    try {
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        publicPath: ruffleBase,
        polyfills: false,
        autoplay: "on",
        unmuteOverlay: "visible",
        letterbox: "on",
        scale: "showAll",
        forceScale: true,
        allowFullscreen: true,
        // Frontiers needs ExternalInterface when entering a save (Ruffle issue #11280).
        allowScriptAccess: true
      };
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = ruffleBase + "ruffle.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Ruffle could not be downloaded from unpkg.com."));
        document.head.appendChild(script);
      });

      // Inflate the four existing parts directly into one final SWF buffer.
      // This avoids retaining an extra full-size compressed copy for the repair.
      const originalLength = 64859117;
      const addedBytes = 13;
      const data = new Uint8Array(originalLength + addedBytes);
      const abort = new AbortController();
      const header = new Uint8Array(8);
      let headerBytes = 0;
      let downloaded = 0;
      let lastPercent = -1;
      const source = (async function* () {
        for (const [name, expectedBytes] of parts) {
          stage = name;
          const response = await fetch(assetBase + name, { signal: abort.signal });
          if (!response.ok) throw new Error(name + ": HTTP " + response.status);
          if (!response.body) throw new Error(name + ": empty response body.");
          const reader = response.body.getReader();
          let partBytes = 0;
          try {
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              partBytes += value.byteLength;
              downloaded += value.byteLength;
              if (partBytes > expectedBytes) throw new Error(name + ": unexpected file size.");
              let skip = 0;
              if (headerBytes < 8) {
                skip = Math.min(8 - headerBytes, value.length);
                header.set(value.subarray(0, skip), headerBytes);
                headerBytes += skip;
                if (headerBytes === 8) {
                  if (header[0] !== 67 || header[1] !== 87 || header[2] !== 83 ||
                      header[3] !== 10 || new DataView(header.buffer).getUint32(4, true) !== originalLength) {
                    throw new Error("Unexpected Frontiers SWF header.");
                  }
                  data.set(header);
                }
              }
              const percent = Math.floor(downloaded * 100 / totalBytes);
              if (percent !== lastPercent) {
                lastPercent = percent;
                message.textContent = "Loading game: " + (downloaded / 1000000).toFixed(1) + " / 58.9 MB";
              }
              if (skip < value.length) yield value.subarray(skip);
            }
          } finally {
            reader.releaseLock();
          }
          if (partBytes !== expectedBytes) {
            throw new Error(name + ": received " + partBytes + " of " + expectedBytes + " bytes.");
          }
        }
      })();
      const compressed = new ReadableStream({
        async pull(controller) {
          const result = await source.next();
          if (result.done) controller.close();
          else controller.enqueue(result.value);
        },
        async cancel() { abort.abort(); await source.return(); }
      });
      try {
        const inflated = compressed.pipeThrough(new DecompressionStream("deflate")).getReader();
        let offset = 8;
        while (true) {
          const { done, value } = await inflated.read();
          if (done) break;
          if (offset + value.length > originalLength) throw new Error("Unexpected decoded SWF size.");
          data.set(value, offset);
          offset += value.length;
        }
        if (offset !== originalLength || downloaded !== totalBytes) {
          throw new Error("Incomplete Frontiers game data.");
        }
      } catch (error) {
        abort.abort();
        throw new Error(error.message || "Frontiers decompression failed (invalid data or checksum).");
      }

      stage = "Frontiers campaign compatibility";
      // AgiV2Handler.isLoggedIn must return false while AGI or AGI.user is absent.
      // Preserve the original !agi.user.isGuest() result when the service exists.
      const codeStart = 1226801;
      const originalCode = [208, 48, 96, 134, 132, 2, 102, 225, 69, 70, 248, 93, 0, 150, 72];
      const guardedCode = [208, 48, 96, 134, 132, 2, 42, 18, 14, 0, 0, 102, 225, 69, 42, 18, 6, 0, 0, 70, 248, 93, 0, 150, 72, 41, 39, 72];
      const questStart = 1226544;
      const originalQuestCheck = [96, 134, 132, 2, 102, 225, 69, 70, 248, 93, 0];
      const guardedQuestCheck = [208, 70, 193, 168, 1, 0, 150, 2, 2, 2, 2];
      const view = new DataView(data.buffer);
      if (!originalQuestCheck.every((byte, i) => data[questStart + i] === byte) ||
          !originalCode.every((byte, i) => data[codeStart + i] === byte) ||
          data[1226796] !== 1 || data[1226800] !== originalCode.length ||
          view.getUint32(202872, true) !== 3380847 ||
          ![487041, 487082, 487090].every(position => data[position] === 114)) {
        throw new Error("Unexpected SWF build. Keep the original krf-6dd546607ad2.part1–4 files.");
      }
      // Insert the two null checks in place. All other game method bodies remain unchanged.
      // Achievement submission already skips guests; use the same safe login check.
      data.set(guardedQuestCheck, questStart);
      data.copyWithin(codeStart + guardedCode.length, codeStart + originalCode.length, originalLength);
      data.set(guardedCode, codeStart);
      data[1226796] = 2;
      data[1226800] = guardedCode.length;
      view.setUint32(202872, 3380847 + addedBytes, true);
      // Preserve r5 save identifiers, so existing kfslot1/2/3 saves remain usable.
      for (const position of [487041, 487082, 487090]) data[position] = 102;
      data[0] = 70; // FWS: the bytes are already decompressed.
      view.setUint32(4, data.length, true);

      stage = "Ruffle initialization";
      message.textContent = "Starting Kingdom Rush Frontiers…";
      const player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("game").appendChild(player);
      await player.ruffle(1).load({
        data,
        swfFileName: "kingdom-rush-frontie-15717.swf",
        base: assetBase
      });
      status.hidden = true;
      player.focus();
    } catch (error) {
      console.error("Kingdom Rush Frontiers launcher:", error);
      message.textContent = "Unable to start: [" + stage + "] " + error.message;
      status.hidden = false;
    }
  })();
  </script>
</body>
</html>
