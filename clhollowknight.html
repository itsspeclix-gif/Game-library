<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const baseUrl =
        'https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@be276da276c91638c1ff2b82c754133e0fdbdad8/';

      const response = await fetch(
        baseUrl + 'index.html',
        { cache: 'no-store' }
      );
      if (!response.ok) {
        throw new Error(`Could not load Hollow Knight (${response.status})`);
      }
      const html = await response.text();

      const gameDocument = html
        .replaceAll(
          'https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/',
          baseUrl
        )
        .replace(
          /<head([^>]*)>/i,
          '<head$1><base href="' + baseUrl + '">'
        );

      document.open();
      document.write(gameDocument);
      document.close();
    })();
  </script>
</body>
</html>
